# ⚠️  DO NOT commit real values — replace placeholders before applying.
# Generate base64:  echo -n "your-value" | base64
#
# Apply:  kubectl apply -f k8s/secret.yaml
# Or use Sealed Secrets / External Secrets Operator in production.
apiVersion: v1
kind: Secret
metadata:
  name: food-delivery-secret
  namespace: food-delivery
type: Opaque
data:
  # App runtime URL — routes through PgBouncer (transaction mode).
  # ?pgbouncer=true disables Prisma prepared statements (required for transaction mode).
  # echo -n "postgresql://postgres:PASSWORD@pgbouncer-service:6432/food_delivery?pgbouncer=true" | base64
  DATABASE_URL: cG9zdGdyZXNxbDovL3Bvc3RncmVzOlBBU1NXT1JEQHBnYm91bmNlci1zZXJ2aWNlOjY0MzIvZm9vZF9kZWxpdmVyeT9wZ2JvdW5jZXI9dHJ1ZQ==

  # Direct URL to Postgres — used ONLY by the migrate Job (DDL incompatible with transaction mode).
  # echo -n "postgresql://postgres:PASSWORD@postgres-service:5432/food_delivery" | base64
  DATABASE_DIRECT_URL: cG9zdGdyZXNxbDovL3Bvc3RncmVzOlBBU1NXT1JEQHBvc3RncmVzLXNlcnZpY2U6NTQzMi9mb29kX2RlbGl2ZXJ5

  # Redis password — consumed by both the app (via REDIS_URL below) and the
  # Redis StatefulSet itself (--requirepass). An unauthenticated Redis
  # reachable on the cluster network is a full read/write data-plane
  # compromise (sessions, rate-limit state, job payloads), not just a cache
  # leak — keep this out of the plaintext ConfigMap.
  # echo -n "strong-redis-password-here" | base64
  REDIS_PASSWORD: c3Ryb25nLXJlZGlzLXBhc3N3b3JkLWhlcmU=

  # echo -n "redis://:strong-redis-password-here@redis-service:6379" | base64
  REDIS_URL: cmVkaXM6Ly86c3Ryb25nLXJlZGlzLXBhc3N3b3JkLWhlcmVAcmVkaXMtc2VydmljZTo2Mzc5

  # echo -n "replace-with-32-char-min-access-secret" | base64
  JWT_ACCESS_SECRET: cmVwbGFjZS13aXRoLTMyLWNoYXItbWluLWFjY2Vzcy1zZWNyZXQ=

  # echo -n "replace-with-32-char-min-refresh-secret" | base64
  JWT_REFRESH_SECRET: cmVwbGFjZS13aXRoLTMyLWNoYXItbWluLXJlZnJlc2gtc2VjcmV0

  # AWS credentials
  # echo -n "AKIAIOSFODNN7EXAMPLE" | base64
  AWS_ACCESS_KEY_ID: QUNLSUFJT1NGT0ROTjdFWEFNUExF

  # echo -n "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" | base64
  AWS_SECRET_ACCESS_KEY: d0phbHJYVXRuRkVNSS9LN01ERU5HL2JQeFJmaUNZRVhBTVBMRUtFWQ==

  # Firebase service account JSON — echo -n '{"type":"service_account",...}' | base64
  FCM_SERVICE_ACCOUNT_JSON: e30=

  # Postgres superuser password (used by postgres StatefulSet)
  # echo -n "strong-password-here" | base64
  POSTGRES_PASSWORD: c3Ryb25nLXBhc3N3b3JkLWhlcmU=
