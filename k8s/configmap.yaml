apiVersion: v1
kind: ConfigMap
metadata:
  name: food-delivery-config
  namespace: food-delivery
data:
  NODE_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "3000"
  APP_PREFIX: "api/v1"
  SWAGGER_ENABLED: "false"

  # Database
  # DATABASE_URL and DATABASE_DIRECT_URL are in Secret (contain credentials)

  DB_ENABLE_QUERY_LOGS: "false"
  # 5 Prisma connections per replica — PgBouncer multiplexes to Postgres.
  # Total Postgres connections = DATABASE_CONNECTION_LIMIT × replicas ≤ pgbouncer pool_size (25).
  DATABASE_CONNECTION_LIMIT: "5"
  DATABASE_POOL_TIMEOUT_SECONDS: "10"

  # Redis
  # REDIS_URL is in Secret (contains the auth password)
  REDIS_KEY_PREFIX: "food-delivery"

  # JWT (non-secret fields)
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "30d"
  JWT_ISSUER: "food-delivery-backend"
  JWT_AUDIENCE: "food-delivery-platform"

  # S3
  S3_REGION: "ap-southeast-1"
  S3_BUCKET: "food-delivery-assets"
