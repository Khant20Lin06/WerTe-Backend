# Run once before each app deployment: kubectl apply -f k8s/migrate/job.yaml
# Then wait:                           kubectl wait --for=condition=complete job/db-migrate -n food-delivery --timeout=120s
# Delete after done:                   kubectl delete -f k8s/migrate/job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: food-delivery
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Wait for postgres to be ready before running migration
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "waiting for postgres..."; sleep 2;
              done
      containers:
        - name: migrate
          image: YOUR_REGISTRY/food-delivery-backend:latest  # replace with your image
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            # Migrations bypass PgBouncer — DDL requires session mode, not transaction mode
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: food-delivery-secret
                  key: DATABASE_DIRECT_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
