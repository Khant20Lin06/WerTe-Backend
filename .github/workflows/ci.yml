name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit -- --no-coverage

      - name: Unit tests with coverage
        run: npm run test:unit -- --coverage --coverageReporters=text-summary
        if: github.event_name == 'pull_request'

      - name: Build
        run: npm run build

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: food_delivery_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/food_delivery_integration

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/food_delivery_integration
          REDIS_URL: redis://localhost:6379/1

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-and-test]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: food_delivery_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/food_delivery_integration

      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/food_delivery_integration
          REDIS_URL: redis://localhost:6379/1
          JWT_ACCESS_SECRET: e2e-access-secret-must-be-at-least-32-chars
          JWT_REFRESH_SECRET: e2e-refresh-secret-must-be-at-least-32char
          JWT_ISSUER: food-delivery-backend
          JWT_AUDIENCE: food-delivery-platform

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-test, e2e-test]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: food_delivery_loadtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/food_delivery_loadtest

      - name: Build application
        run: npm run build

      - name: Start application
        run: node -r ./dist/instrumentation dist/main &
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/food_delivery_loadtest
          REDIS_URL: redis://localhost:6379/2
          APP_PORT: 3000
          APP_HOST: 0.0.0.0
          APP_PREFIX: api/v1
          # Minimal required secrets — dummy values sufficient for load test
          # because the tested endpoints (health, metrics) require no auth.
          JWT_ACCESS_SECRET: ci-load-test-jwt-access-secret-not-real-32ch
          JWT_REFRESH_SECRET: ci-load-test-jwt-refresh-secret-not-real-32c

      - name: Wait for application to be ready
        run: |
          echo "Waiting for app to accept connections..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health/live > /dev/null 2>&1; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App did not start within 30s" >&2
          exit 1

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin k6-v0.54.0-linux-amd64/k6

      - name: Run load test
        run: k6 run load-test/k6.js -e BASE_URL=http://localhost:3000/api/v1
        # k6 exits non-zero when any threshold is breached — CI job fails automatically.
