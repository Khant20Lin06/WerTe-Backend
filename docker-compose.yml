x-backend-env: &backend-env
  NODE_ENV: development
  APP_HOST: 0.0.0.0
  APP_PORT: 3000
  APP_PREFIX: api/v1
  SWAGGER_ENABLED: 'true'
  # PgBouncer sits in front of Postgres.
  # ?pgbouncer=true disables Prisma prepared statements (incompatible with transaction mode).
  # connection_limit=5 per replica — PgBouncer multiplexes to Postgres, so fewer is better.
  DATABASE_URL: postgresql://postgres:postgres@pgbouncer:6432/food_delivery?pgbouncer=true&connection_limit=5&pool_timeout=10
  DB_ENABLE_QUERY_LOGS: 'false'
  REDIS_URL: redis://redis:6379
  REDIS_KEY_PREFIX: food-delivery
  JWT_ACCESS_SECRET: replace-with-a-32-char-min-access-secret
  JWT_REFRESH_SECRET: replace-with-a-32-char-min-refresh-secret
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 30d
  JWT_ISSUER: food-delivery-backend
  JWT_AUDIENCE: food-delivery-platform
  S3_BUCKET: food-delivery-assets
  S3_REGION: ap-southeast-1
  FCM_PROJECT_ID: sample-project

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres -d food_delivery' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgbouncer:
    image: bitnami/pgbouncer:1.23.1
    restart: unless-stopped
    environment:
      # Connect to real Postgres
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: '5432'
      POSTGRESQL_DATABASE: food_delivery
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: postgres
      # Transaction mode — required for Prisma (?pgbouncer=true in DATABASE_URL)
      PGBOUNCER_POOL_MODE: transaction
      # 25 server connections to Postgres shared across all app clients
      PGBOUNCER_DEFAULT_POOL_SIZE: '25'
      PGBOUNCER_MIN_POOL_SIZE: '5'
      # Drop idle client connections after 60s
      PGBOUNCER_CLIENT_IDLE_TIMEOUT: '60'
      # Drop idle server connections after 300s
      PGBOUNCER_SERVER_IDLE_TIMEOUT: '300'
      # Reject clients when all 25 server slots are busy (fail fast)
      PGBOUNCER_RESERVE_POOL_SIZE: '5'
      PGBOUNCER_RESERVE_POOL_TIMEOUT: '3'
      PGBOUNCER_AUTH_TYPE: md5
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U postgres -d food_delivery' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      target: migrate
    environment:
      # Migrations must bypass PgBouncer (DDL is incompatible with transaction mode)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/food_delivery
    depends_on:
      postgres:
        condition: service_healthy
    command: [ 'npx', 'prisma', 'migrate', 'deploy' ]
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    healthcheck:
      test: [ 'CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/v1/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
