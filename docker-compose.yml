x-backend-env: &backend-env
  NODE_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: 3000
  APP_PREFIX: api/v1
  SWAGGER_ENABLED: 'true'
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/food_delivery
  DB_ENABLE_QUERY_LOGS: 'false'
  REDIS_URL: redis://redis:6379
  REDIS_KEY_PREFIX: food-delivery
  JWT_ACCESS_SECRET: replace-with-a-32-char-min-access-secret
  JWT_REFRESH_SECRET: replace-with-a-32-char-min-refresh-secret
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 30d
  JWT_ISSUER: food-delivery-backend
  JWT_AUDIENCE: food-delivery-platform
  S3_BUCKET: food-delivery-assets
  S3_REGION: ap-southeast-1
  FCM_PROJECT_ID: sample-project

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d food_delivery']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/food_delivery
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
